<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>MuyleeGram</title>
    <!-- PWA Настройки -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b0e14">
  
  <!-- Настройки для iOS (iPhone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MuyleeGram">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="login" class="screen">
    <div class="login-box">
      <!-- Красивый градиентный заголовок -->
      <h1 style="font-size: 32px; margin-bottom: 8px; background: linear-gradient(90deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">MuyleeGram</h1>
      <p>Введи свой ник, чтобы начать</p>
      <input id="nick" placeholder="Твой ник" maxlength="20" autofocus>
      <button id="loginBtn">Войти</button>
      <p id="loginErr" class="err"></p>
    </div>
  </div>

  <div id="app" class="screen hidden">
    <aside id="sidebar">
      <div class="me">
        <div class="avatar" id="myAvatar"></div>
        <div class="me-info">
          <div class="me-name" id="me"></div>
          <div class="me-status">в сети</div>
        </div>
      </div>
      <div class="online-title">Онлайн</div>
      <ul id="users"></ul>
    </aside>

    <main id="chatArea">
      <header id="chatHeader">
        <button id="backBtn" class="back-btn">←</button>
        <div id="chatHeaderText">Выбери собеседника слева</div>
      </header>
      <div id="messages"></div>
      <div id="typing" class="typing"></div>
      <form id="sendForm">
        <textarea id="msgInput" placeholder="Написать сообщение..." autocomplete="off" rows="1" disabled></textarea>
        <button id="sendBtn" disabled title="Отправить">➤</button>
      </form>
    </main>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
