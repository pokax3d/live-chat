<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Градиент от светло-фиолетового к синему -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    
    <!-- Маска для вырезания полукругов снизу -->
    <mask id="cutout">
      <rect width="100" height="100" fill="white" />
      <circle cx="25" cy="80" r="9" fill="black" />
      <circle cx="75" cy="80" r="9" fill="black" />
    </mask>
  </defs>
  
  <!-- Темный фон для иконки в браузере -->
  <rect width="100" height="100" rx="20" fill="#0b0e14" />
  
  <!-- Основа буквы M -->
  <path d="M 25 85 L 25 45 Q 25 20 38 20 Q 50 20 50 50 Q 50 20 62 20 Q 75 20 75 45 L 75 85" 
        fill="none" 
        stroke="url(#purpleGrad)" 
        stroke-width="18" 
        stroke-linecap="butt" 
        stroke-linejoin="round"
        mask="url(#cutout)" />
        
  <!-- Пунктирные линии -->
  <line x1="15" y1="65" x2="35" y2="65" stroke="white" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="65" y1="65" x2="85" y2="65" stroke="white" stroke-width="1.5" stroke-dasharray="2,2" />
</svg>